name: carport
description: "Car maintenance tracker."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  any_link_preview: ^3.0.1
  bloc_concurrency: ^0.3.0
  cupertino_icons: ^1.0.8
  equatable: ^2.0.8
  file_picker: ^8.3.7
  flutter_bloc: ^9.1.1
  flutter_local_notifications: ^19.0.0
  freezed_annotation: ^3.1.0
  get_it: ^9.2.1
  go_router: ^17.1.0
  google_fonts: ^6.2.1
  http: ^1.2.2
  image_picker: ^1.1.2
  intl: ^0.20.2
  logger: ^2.6.2
  lucide_flutter: ^1.20.0
  local_auth: ^2.3.0
  mobile_scanner: ^7.2.0
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  sqflite: ^2.4.1
  timezone: ^0.10.0
  url_launcher: ^6.3.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  analyzer: ^9.0.0
  bloc_test: ^10.0.0
  build_runner: ^2.11.1
  carport_lint_rules:
    path: carport_lint_rules
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

dependency_overrides:
  # Until mobile_scanner 7.2.1+ is on pub.dev (juliansteenbakker/mobile_scanner#1729).
  mobile_scanner:
    git:
      url: https://github.com/juliansteenbakker/mobile_scanner.git
      ref: 3c770c32c408da8659475e36436e41ad76b57b4b

flutter:
  uses-material-design: true
